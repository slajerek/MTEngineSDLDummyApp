# mtengine-app.conf -- this app's parameters for the engine-owned build
# drivers (MTEngineSDL/tools/appbuild/app-build-*.{sh,ps1}).
#
# Same format constraints as mtengine.caps: KEY=VALUE, whole-line # comments
# only -- bash `source`, PowerShell and the drivers all read this one file.
# This file plus mtengine.caps is ALL an app contributes to its build; the
# flow itself lives in the engine (unification plan, Phase 3).
MT_APP_NAME=MTEngineSDLDummyApp
MT_MACOS_PROJECT=platform/MacOS/MTEngineSDLDummyApp.xcodeproj
MT_MACOS_SCHEME=MTEngineSDLDummyApp
MT_CMAKE_TARGET=MTEngineSDLDummyApp
MT_WINDOWS_SLN=platform/Windows/MTEngineSDLDummyApp.sln
MT_WINDOWS_EXE=MTEngineSDLDummyApp.exe
