			shellPath = /bin/bash;
			shellScript = "# MTCapsBackstop. On an APP target a missing capability set is an ERROR,\n# not a standalone build: the app would compile against the ENGINE's\n# defaults rather than its own mtengine.caps.\n#\n# alwaysOutOfDate=1 because a stale capability set is exactly the case where\n# nothing else changed -- a phase Xcode skips is a check that cannot fail.\nbash \"$PROJECT_DIR/../../../MTEngineSDL/tools/mtcaps/xcode-backstop.sh\" app\n";
		};
		AABBCCDD2699999900CC0002 /* Embed FFmpeg dylibs */ = {
			isa = PBXShellScriptBuildPhase;
			alwaysOutOfDate = 1;
			buildActionMask = 2147483647;
			files = (
			);
			inputFileListPaths = (
			);
			inputPaths = (
			);
			name = "Embed FFmpeg dylibs";
			outputFileListPaths = (
			);
			outputPaths = (
			);
			runOnlyForDeploymentPostprocessing = 0;
			shellPath = /bin/bash;
			shellScript = "# FFmpeg is the one engine dependency that is NOT folded into a static\n# archive -- shipping it as a dylib is what discharges the LGPL obligation --\n# so a target that pulls in CVideoSourceFFmpeg has to carry the five dylibs\n# inside the bundle.\n#\n# A SCRIPT, not a Copy Files phase, and that is deliberate: a Copy Files phase\n# needs PBXFileReferences, and a file reference is a fixed path. These files\n# live under $MT_CAPS_LIBS_DIR, which is keyed by the resolved capability set\n# and therefore has no path this project can name. Same reason the archives\n# are reached with -l against a search path rather than by reference.\nset -euo pipefail\n\nif [ -z \"${MT_CAPS_LIBS_DIR:-}\" ]; then\n    echo \"error: MT_CAPS_LIBS_DIR is empty -- build through build-macos.sh or the scheme's pre-action\" >&2\n    exit 1\nfi\n\nDEST=\"$BUILT_PRODUCTS_DIR/$FRAMEWORKS_FOLDER_PATH\"\nmkdir -p \"$DEST\"\n\n# -R keeps the SONAME symlink a symlink. The install names were normalised to\n# @rpath/<soname> when the dylibs were built, so that link is what a consumer\n# actually resolves; flattening it would double the shipped bytes.\nfor lib in libavutil libavcodec libavformat libswscale libswresample; do\n    found=0\n    for f in \"$MT_CAPS_LIBS_DIR/$lib\".*.dylib \"$MT_CAPS_LIBS_DIR/$lib.dylib\"; do\n        [ -e \"$f\" ] || continue\n        cp -R -f \"$f\" \"$DEST/\"\n        found=1\n    done\n    if [ \"$found\" -eq 0 ]; then\n        echo \"error: $lib not staged in $MT_CAPS_LIBS_DIR -- run build-video_codecs.sh\" >&2\n        exit 1\n    fi\ndone\n\n# Re-sign what we just copied in. The bundle was signed before this phase ran,\n# and an unsigned dylib inside a signed bundle fails at load. Ad-hoc matches\n# what build-macos.sh passes for CODE_SIGN_IDENTITY.\nif [ \"${CODE_SIGNING_ALLOWED:-YES}\" != \"NO\" ]; then\n    for f in \"$DEST\"/*.dylib; do\n        [ -f \"$f\" ] || continue\n        codesign --force --sign \"${EXPANDED_CODE_SIGN_IDENTITY:--}\" \"$f\" >/dev/null 2>&1 || true\n    done\nfi\n";
		};
/* End PBXShellScriptBuildPhase section */

